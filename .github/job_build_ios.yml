name: Build TRX (iOS)

on:
  push:
    branches: [ "ios" ]
  pull_request:
    branches: [ "ios" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools via Homebrew
        run: |
          brew update
          brew install python meson ninja uthash pkg-config

      - name: Configure iOS SDK & Permissions
        run: |
          IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDKROOT=$IOS_SDK_PATH" >> $GITHUB_ENV
          
          # Assicura i permessi di esecuzione per i wrapper
          chmod +x tools/shared/ios/clang-ios-arm64 tools/shared/ios/pkg-config-ios || true

      - name: Setup Meson build
        run: |
          meson setup build-ios-arm64 src \
            --cross-file tools/shared/ios/arm64_device_cross_file.txt \
            --buildtype release

      - name: Compile with Ninja
        run: |
          ninja -C build-ios-arm64
