name: Build TRX (iOS)

on:
  push:
    branches: [ "ios" ]
    tags:
      - 'ios*'
  pull_request:
    branches: [ "ios" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools via Homebrew
        run: |
          brew update
          brew install python meson ninja uthash pkg-config

      - name: Configure iOS SDK & Permissions
        run: |
          IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDKROOT=$IOS_SDK_PATH" >> $GITHUB_ENV
          
          chmod +x tools/shared/ios/clang-ios-arm64 tools/shared/ios/pkg-config-ios || true
          chmod +x tools/shared/ios/gen_ipa.py || true

      - name: Setup Meson build
        run: |
          meson setup build-ios-arm64 src \
            --cross-file tools/shared/ios/arm64_device_cross_file.txt \
            --buildtype release

      - name: Compile with Ninja
        run: |
          ninja -C build-ios-arm64

      - name: Generate IPA package
        run: |
          python3 tools/shared/ios/gen_ipa.py

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRX-iOS-IPA
          path: build-ios-arm64/TRX.ipa

      - name: Update GitHub Release (Overwrite existing tag release)
        if: startsWith(github.ref, 'refs/tags/ios')
        uses: softprops/action-gh-release@v2
        with:
          files: build-ios-arm64/TRX.ipa
          tag_name: ios
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
